name: Pistes commerciales (Var)

on:
  schedule:
    - cron: "41 5 * * 1"   # chaque lundi, 5 h 41 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  pistes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Marchés passés, festivals, ouvertures, syndics, promoteurs
        run: node scripts/pistes.mjs
      - name: Publier la liste
        run: |
          git config user.name "helix-veille"
          git config user.email "helix-veille@users.noreply.github.com"
          git add docs/pistes.json
          git diff --cached --quiet || (git commit -m "Pistes : mise à jour hebdomadaire" && git pull --rebase && git push)
